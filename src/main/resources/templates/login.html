<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>
<body>

    <form th:object="${loginForm}" th:action="@{/login}" method="post">
        
        <div>
            ユーザーネーム：<input type="text" th:field="*{username}">
        </div>
        <div>
            パスワード：<input type="password" th:field="*{password}">
        </div>
        <div>
            <input type="submit" value="ログイン">
        </div>
        
    </form>
    
</body>
</html>
